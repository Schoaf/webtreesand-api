name: Deploy to production

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: FTP deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./
          # Keep the existing folder name on the server - the module computes
          # its route slug from basename(__DIR__), so deploying into the same
          # webtreesand-api/ folder (not the new api4webtrees/ name upstream
          # uses) keeps the app's hardcoded _webtreesand-api_ route working
          # with no app-side change needed.
          server-dir: ./modules_v4/webtreesand-api/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
